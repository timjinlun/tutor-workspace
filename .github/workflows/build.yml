# Tags publish both desktop installers. Manual runs only retain build artifacts.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: build:mac
            installer: dist/*.dmg
          - os: windows-latest
            script: build:win
            installer: dist/*-win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const version=require('./package.json').version; const expected='v'+version; if(process.env.GITHUB_REF_NAME!==expected) throw new Error('Tag '+process.env.GITHUB_REF_NAME+' does not match '+expected)"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Electron 43 downloads its runtime on first require. Do this before Vitest
      # so the Windows download cannot starve parallel test workers.
      - name: Prepare Electron runtime
        run: node -e "require('electron')"
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint

      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned test builds; release publishing is handled separately below.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - run: npm run test:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-installer
          path: ${{ matrix.installer }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-desktop-check
          path: out/qa/desktop-*/
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: installers
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*.dmg
            installers/**/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true

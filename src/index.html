<!DOCTYPE html>
<html lang="zh-CN" data-theme="ledger">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>独立老师工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-plex" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link id="font-wenkai" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
/* =====================================================================
   独立老师工作台 · 视觉系统「点名册」
   三个色相：纸/墨、青（主）、朱（印章与警示）。三种字体角色：
   display 楷体（课本字）· num 衬线等宽数字（账本数）· ui 无衬线（一切说明）。
   主题靠 data-theme 切 token，骨架不动。
   ===================================================================== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#F8F6F1; --sheet:#FFFEFB; --sheet-2:#F3F0E9; --sheet-3:#ECE8DF;
  --rule:#E2DDD2; --rule-2:#EEEAE1;
  --ink:#1B2430; --ink-2:#4B5563; --ink-3:#8B909A;
  --qing:#1E5A6B; --qing-2:#E1EDEF; --qing-3:#174A58;
  --zhu:#C2412C; --zhu-2:#F9E9E5;
  --amber:#A66A12; --amber-2:#FAF0DC;
  --stamp:var(--zhu); --stamp-text:"到";
  --f-display:"LXGW WenKai Screen","Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif;
  --f-num:"IBM Plex Serif","Songti SC","Noto Serif SC",Georgia,serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",Inter,sans-serif;
  --r:3px; --r-cell:2px;
  --grid-alpha:.55;
  --sp:1; /* density multiplier */
  --spine-w:64px;
  --shadow-modal:0 24px 60px rgba(27,36,48,.18);
}
:root[data-theme="slate"]{
  --paper:#0F1216; --sheet:#151920; --sheet-2:#1B2027; --sheet-3:#222932;
  --rule:#262C35; --rule-2:#1F252D;
  --ink:#E6E9EF; --ink-2:#A9B1BE; --ink-3:#737C8A;
  --qing:#E8A33D; --qing-2:rgba(232,163,61,.14); --qing-3:#D3922F;
  --zhu:#E5574A; --zhu-2:rgba(229,87,74,.14);
  --amber:#E8A33D; --amber-2:rgba(232,163,61,.12);
  --stamp:var(--qing);
  --grid-alpha:.22;
  --shadow-modal:0 24px 60px rgba(0,0,0,.6);
}
:root[data-theme="clean"]{
  --paper:#F5F7F6; --sheet:#FFFFFF; --sheet-2:#EEF2F0; --sheet-3:#E4EAE7;
  --rule:#E1E7E4; --rule-2:#EDF1EF;
  --ink:#16281F; --ink-2:#4A5D54; --ink-3:#8FA098;
  --qing:#2D6A4F; --qing-2:#E4EFE9; --qing-3:#245740;
  --zhu:#D9534F; --zhu-2:#FBE9E8;
  --amber:#B7791F; --amber-2:#FBF1DD;
  --stamp:var(--qing); --stamp-text:"";
  --f-display:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  --r:8px; --r-cell:6px;
  --grid-alpha:0;
}
:root[data-density="compact"]{--sp:.72}

html{background:var(--paper)}
body{
  font-family:var(--f-ui);background:var(--paper);color:var(--ink);
  line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px;
  font-variant-numeric:tabular-nums;
}
/* 手帐格纸底纹：虚线格，交叉处成十字，静 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(0deg,transparent 0 3px,var(--rule-2) 3px 4px,transparent 4px 24px),
    repeating-linear-gradient(90deg,transparent 0 3px,var(--rule-2) 3px 4px,transparent 4px 24px);
  background-size:24px 24px;opacity:var(--grid-alpha);
}
::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px;border:2px solid var(--paper)}
::selection{background:var(--qing-2)}
input,select,button,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;transition:background .12s,border-color .12s,color .12s,transform .08s}
button:active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--qing);outline-offset:2px}
code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em;background:var(--sheet-2);padding:1px 5px;border-radius:2px}
.num,.kpi-value,.sum-val,.amt,td.sum,.stu-stats strong{font-family:var(--f-num);font-variant-numeric:tabular-nums lining-nums}

/* ---------- 布局：书脊 + 主页 ---------- */
.layout{display:flex;min-height:100vh;position:relative;z-index:1}
.sidebar{
  width:var(--spine-w);flex-shrink:0;position:sticky;top:0;height:100vh;overflow:visible;z-index:30;
  background:var(--sheet-2);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:stretch;
}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0 12px}
.brand-logo{
  width:34px;height:34px;border-radius:50%;background:var(--stamp);color:var(--sheet);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:16px;
  transform:rotate(-8deg);box-shadow:inset 0 0 0 1.5px var(--sheet),inset 0 0 0 2.5px var(--stamp);
}
.brand-name,.brand-sub{display:none}
.nav{flex:1;display:flex;flex-direction:column;gap:6px;padding:6px 0 6px 10px;overflow:visible}
.nav-more-wrap{position:relative;display:flex;justify-content:flex-end}
.nav-flyout{position:absolute;left:calc(100% + 8px);top:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow-modal);padding:6px;min-width:150px;z-index:40;animation:sheet-in .12s ease-out}
.nav-flyout::before{content:"";position:absolute;left:-6px;top:16px;width:10px;height:10px;background:var(--sheet);border-left:1px solid var(--rule);border-bottom:1px solid var(--rule);transform:rotate(45deg)}
.nav-flyout button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:transparent;border-radius:2px;font-size:13px;color:var(--ink-2);text-align:left;white-space:nowrap}
.nav-flyout button svg{width:16px;height:16px;flex-shrink:0}
.nav-flyout button:hover{background:var(--sheet-2);color:var(--qing)}
.nav-flyout button.on{color:var(--qing);font-weight:600}
.nav-badge.static{position:static;margin-left:auto;border:none;transform:none}
.nav-item{
  position:relative;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-size:14px;line-height:1;color:var(--ink-2);
  background:var(--sheet);border:1px solid var(--rule);border-right:none;
  border-radius:var(--r) 0 0 var(--r);padding:11px 0;width:44px;margin-left:auto;
  transition:width .14s ease,background .12s,color .12s;
}
.nav-label{display:flex;flex-direction:column;align-items:center;gap:5px}
.nav-label i{font-style:normal;display:block;line-height:1}
.nav-item svg{display:none}
.nav-item:hover{background:var(--qing-2);color:var(--qing-3);width:48px}
.nav-item.active{background:var(--qing);color:var(--sheet);border-color:var(--qing);width:54px;font-weight:600}
.nav-badge{
  position:absolute;top:-5px;left:-5px;writing-mode:horizontal-tb;
  background:var(--zhu);color:#fff;font-family:var(--f-num);font-size:10px;font-weight:600;
  min-width:17px;height:17px;padding:0 4px;border-radius:999px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--sheet-2);letter-spacing:0;
}
.side-foot{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--ink-3);padding:10px 0 14px;line-height:1}
.side-foot i{font-style:normal;display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:12px;padding:calc(14px*var(--sp)) 22px;
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20;
}
.topbar h1{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:.02em;color:var(--ink)}
.topbar .sub{font-size:12px;color:var(--ink-3)}
.topbar-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{max-width:1180px;margin:0 auto;padding:calc(20px*var(--sp)) 22px 96px;width:100%}
.bottom-nav{display:none}

/* ---------- 纸张与分区 ---------- */
.section{
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);
  padding:calc(18px*var(--sp)) calc(20px*var(--sp));margin-bottom:calc(16px*var(--sp));
}
.section-title{
  font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.02em;
  margin-bottom:calc(12px*var(--sp));display:flex;align-items:center;gap:8px;color:var(--ink);
}
.section-title::before{content:"";width:3px;height:14px;background:var(--qing);border-radius:1px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:calc(12px*var(--sp));gap:10px;flex-wrap:wrap}
.section-head .section-title{margin-bottom:0}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:calc(12px*var(--sp))}
.divider{border:none;border-top:1px dashed var(--rule);margin:calc(14px*var(--sp)) 0}
.empty-state{
  padding:28px;text-align:center;color:var(--ink-3);font-size:13px;
  background:transparent;border-radius:var(--r);border:1px dashed var(--rule);font-family:var(--f-display);letter-spacing:.04em;
}

/* ---------- 按钮 ---------- */
.btn{
  padding:8px 14px;border-radius:var(--r);border:1px solid var(--qing);background:var(--qing);color:var(--sheet);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.2;letter-spacing:.01em;
}
.btn:hover{background:var(--qing-3);border-color:var(--qing-3)}
.btn.ghost{background:var(--sheet);border-color:var(--rule);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--qing);color:var(--qing);background:var(--sheet)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--sheet);border-color:var(--zhu);color:var(--zhu)}
.btn.danger:hover{background:var(--zhu-2)}
.btn.warn{background:var(--sheet);border-color:var(--amber);color:var(--amber)}
.btn.warn:hover{background:var(--amber-2)}
.btn.green{background:var(--qing);border-color:var(--qing);color:var(--sheet)}
.btn svg{width:14px;height:14px}

/* ---------- KPI：账本汇总带 ---------- */
.kpi-row{
  display:flex;flex-wrap:wrap;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);
  margin-bottom:calc(16px*var(--sp));overflow:hidden;
}
.kpi-card{
  flex:1 1 150px;padding:calc(13px*var(--sp)) 18px;border-left:1px solid var(--rule-2);border-top:none;
  background:transparent;box-shadow:none;border-radius:0;min-width:0;
}
.kpi-card:first-child{border-left:none}
.kpi-label{font-size:11px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:4px;white-space:nowrap}
.kpi-value{font-size:24px;line-height:1.1;font-weight:500;color:var(--ink);white-space:nowrap}
.kpi-value.qing{color:var(--qing)}.kpi-value.zhu{color:var(--zhu)}.kpi-value.amber{color:var(--amber)}
.cur{font-weight:400;color:var(--ink-3);margin-right:1px;font-size:.78em}
.kpi-unit{font-family:var(--f-ui);font-size:11px;font-weight:400;margin-left:3px;color:var(--ink-3)}

/* ---------- 提示条：左侧一根色线，不铺大色块 ---------- */
.tip-bar{
  background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--amber);color:var(--ink-2);
  font-size:12.5px;padding:10px 14px;border-radius:var(--r);margin-bottom:calc(14px*var(--sp));line-height:1.55;
}
.tip-bar.red{border-left-color:var(--zhu)}
.tip-bar.green{border-left-color:var(--qing)}
.tip-bar b{color:var(--ink)}

/* ---------- 标签 / 徽章 / 小片 ---------- */
.badge{padding:2px 8px;border-radius:2px;font-size:11px;font-weight:600;letter-spacing:.02em;border:1px solid transparent}
.badge-ok{background:var(--qing-2);color:var(--qing)}
.badge-low{background:var(--amber-2);color:var(--amber)}
.badge-danger{background:var(--zhu-2);color:var(--zhu)}
.badge-done{background:var(--sheet-2);color:var(--ink-3)}
.chip{font-size:11px;padding:3px 9px;border-radius:2px;font-weight:600;white-space:nowrap;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2)}
.chip.red{border-color:var(--zhu);color:var(--zhu)}.chip.amber{border-color:var(--amber);color:var(--amber)}.chip.blue{border-color:var(--qing);color:var(--qing)}
button.chip:hover{background:var(--sheet-2)}
.tag{font-size:11px;padding:1px 7px;border-radius:2px;background:var(--sheet-2);color:var(--ink-2)}
.tag.overdue{background:var(--zhu-2);color:var(--zhu)}
.prio{padding:1px 6px;border-radius:2px;font-size:10.5px;font-weight:700;font-family:var(--f-num);letter-spacing:.04em}
.prio-P0{background:var(--zhu);color:#fff}.prio-P1{background:var(--amber-2);color:var(--amber)}.prio-P2{background:var(--sheet-2);color:var(--ink-2)}
.domain-badge{font-size:10px;padding:1px 6px;border-radius:2px;font-weight:600}
.domain-公域{background:var(--qing-2);color:var(--qing)}.domain-私域{background:var(--amber-2);color:var(--amber)}

/* ---------- 表单 ---------- */
.fi{
  width:100%;padding:9px 11px;border-radius:var(--r);border:1px solid var(--rule);font-size:14px;margin-bottom:10px;outline:none;
  background:var(--sheet);color:var(--ink);transition:border-color .12s,box-shadow .12s;
}
.fi:hover{border-color:var(--ink-3)}
.fi:focus{border-color:var(--qing);box-shadow:0 0 0 3px var(--qing-2)}
.fi::placeholder{color:var(--ink-3)}
select.fi{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.flabel{font-size:11.5px;color:var(--ink-2);margin-bottom:5px;display:block;font-weight:500;letter-spacing:.03em}
.check-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.check-item{display:flex;align-items:center;gap:6px;padding:8px 11px;border:1px solid var(--rule);border-radius:var(--r);font-size:13px;cursor:pointer;background:var(--sheet);user-select:none}
.check-item input{width:15px;height:15px;cursor:pointer;margin:0;accent-color:var(--qing)}
.check-item:has(input:checked){border-color:var(--qing);background:var(--qing-2);color:var(--qing);font-weight:600}
.color-input{height:40px;padding:3px}
textarea.fi{line-height:1.5;resize:vertical}

/* ---------- 弹窗 ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(27,36,48,.42);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;backdrop-filter:blur(2px)}
:root[data-theme="slate"] .modal-overlay{background:rgba(0,0,0,.6)}
.modal-box{
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px;width:100%;max-width:440px;
  box-shadow:var(--shadow-modal);max-height:90vh;overflow-y:auto;animation:sheet-in .16s ease-out;
}
.modal-box.wide{max-width:580px}
.modal-title{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.02em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px dashed var(--rule)}
.modal-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
@keyframes sheet-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- 待办 ---------- */
.todo-item{display:flex;align-items:flex-start;gap:12px;padding:calc(12px*var(--sp)) 14px;border:1px solid var(--rule);border-radius:var(--r);margin-bottom:8px;background:var(--sheet)}
.todo-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sheet);font-weight:700;margin-top:1px;cursor:pointer}
.todo-check.on{background:var(--qing);border-color:var(--qing)}
.todo-main{flex:1;min-width:0}
.todo-title{font-size:14px;font-weight:600}
.todo-title.done{text-decoration:line-through;text-decoration-color:var(--zhu);color:var(--ink-3)}
.todo-meta{font-size:12px;color:var(--ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- 收支 ---------- */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;margin-bottom:calc(16px*var(--sp));background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.sum-card{background:transparent;border-radius:0;padding:13px 16px;box-shadow:none;border-left:1px solid var(--rule-2)}
.sum-card:first-child{border-left:none}
.sum-label{font-size:11px;color:var(--ink-3);letter-spacing:.06em}.sum-val{font-size:22px;font-weight:500;margin-top:4px;color:var(--ink)}
.sum-val.green{color:var(--qing)}.sum-val.red{color:var(--zhu)}
.legend-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:1px;flex-shrink:0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rec-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--rule-2);font-size:13.5px}
.rec-row:last-child{border-bottom:none}
.rec-row .amt{font-weight:600}.rec-row .amt.red{color:var(--zhu)}.rec-row .amt.green{color:var(--qing)}

/* ---------- 招生看板 ---------- */
.kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kcol{background:var(--sheet-2);border-radius:var(--r);padding:10px;min-height:120px;border:1px solid var(--rule-2)}
.kcol-head{font-family:var(--f-display);font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.04em}
.kcol-count{background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:0 7px;font-size:11px;color:var(--ink-3);font-family:var(--f-num)}
.lead-card{background:var(--sheet);border-radius:var(--r);padding:10px;margin-bottom:8px;border:1px solid var(--rule)}
.lead-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.lead-line{font-size:12px;color:var(--ink-2);margin-top:3px}
.lead-actions{display:flex;gap:4px;margin-top:8px}
.lead-actions button{flex:1;padding:4px 0;font-size:11px;border-radius:2px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2)}
.lead-actions button:hover{border-color:var(--qing);color:var(--qing)}
.src-list{display:flex;flex-direction:column;gap:8px}
.src-item{display:flex;align-items:center;gap:10px;font-size:13px}
.src-bar{height:6px;background:var(--sheet-2);border-radius:1px;flex:1;overflow:hidden}
.src-fill{height:100%;background:var(--qing)}

/* ---------- 首页 ---------- */
.today-card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px 18px;margin-bottom:calc(14px*var(--sp))}
.today-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:16px;font-weight:600;margin-bottom:8px;letter-spacing:.02em}
.mini{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule-2);font-size:13.5px}
.mini:last-child{border-bottom:none}
.mini .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-family:var(--f-display);border:1px solid currentColor;background:transparent!important}
.mini .mc{flex:1;min-width:0}
.mini .mt{font-weight:600}.mini .ms{font-size:12px;color:var(--ink-3)}

/* ---------- 学员卡：像一张学员档案卡 ---------- */
.stu-card{background:var(--sheet);border-radius:var(--r);padding:15px 16px;border:1px solid var(--rule);box-shadow:none;position:relative}
.stu-name{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.04em}
.stu-course{font-size:12px;color:var(--ink-3);margin:2px 0 10px}

.tbl tr:hover td{background:var(--sheet-2)}

/* ---------- 考勤表：点名册 ---------- */
.roll-head{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:calc(14px*var(--sp))}
.roll-title{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.06em;min-width:190px;text-align:center}
.roll-wrap{overflow-x:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
table.roll{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.roll th{position:sticky;top:0;background:var(--sheet);z-index:2;padding:7px 3px;text-align:center;border-bottom:1px solid var(--rule);font-weight:400;min-width:32px}
.roll th .d{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);line-height:1.1}
.roll th .w{font-size:9.5px;color:var(--ink-3);margin-top:2px;letter-spacing:.04em}
.roll th.wk .d{color:var(--ink-3)}
.roll th.wk,.roll td.wk{background:var(--sheet-2)}
.roll th.today .d{color:var(--qing);font-weight:600}
.roll th.today,.roll td.today{background:var(--qing-2)}
.roll th.nm,.roll td.nm{position:sticky;left:0;z-index:3;text-align:left;padding-left:14px;min-width:82px;background:var(--sheet)}
.roll th.cs,.roll td.cs{position:sticky;left:82px;z-index:3;text-align:left;min-width:56px;padding-right:10px;background:var(--sheet);border-right:2px solid var(--zhu);}
:root[data-theme="clean"] .roll th.cs,:root[data-theme="clean"] .roll td.cs{border-right-color:var(--rule)}
.roll th.nm,.roll th.cs{z-index:4}
.roll td{padding:0;text-align:center;height:38px;border-bottom:1px solid var(--rule-2)}
.roll td.nm{font-family:var(--f-display);font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.roll td.cs{font-size:11px;color:var(--ink-3)}
.roll td.sum{font-family:var(--f-num);font-weight:600;font-size:13.5px;color:var(--qing);min-width:44px}
.roll td.fee{font-family:var(--f-num);font-size:12.5px;color:var(--ink-2);min-width:70px;padding-right:12px;text-align:right}
.roll tr:hover td:not(.wk):not(.today){background:var(--sheet-2)}
.roll tr:hover td.nm,.roll tr:hover td.cs{background:var(--sheet-2)}
.cell{width:24px;height:24px;margin:0 auto;border:1px dashed var(--rule);border-radius:var(--r-cell);cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .1s,background .1s}
.cell:hover{border-style:solid;border-color:var(--qing);background:var(--sheet)}
.cell.on{border:1.5px solid var(--stamp);border-radius:50%;color:var(--stamp);font-family:var(--f-display);font-size:12px;font-weight:600;
  transform:rotate(-8deg);mix-blend-mode:multiply;
  box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--stamp) 40%,transparent),inset 1px 1px 2px color-mix(in srgb,var(--stamp) 22%,transparent)}
.cell.on::after{content:var(--stamp-text)}
:root[data-theme="slate"] .cell.on{mix-blend-mode:normal}

.cell.on.new{animation:stamp .18s cubic-bezier(.2,.9,.3,1.2)}
@keyframes stamp{from{transform:scale(1.6) rotate(-16deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
:root[data-theme="clean"] .cell.on.new{animation:stamp-flat .16s ease-out}

.cell .n{position:absolute;top:-6px;right:-7px;background:var(--ink);color:var(--sheet);font-family:var(--f-num);font-size:9px;min-width:14px;height:14px;border-radius:999px;display:flex;align-items:center;justify-content:center;transform:rotate(8deg);letter-spacing:0}

.roll-foot{font-size:12px;color:var(--ink-3);margin-top:10px;text-align:center}

.legend-row .num{font-family:var(--f-num)}

/* ---------- 打卡复核弹窗里的记录 ---------- */
.att-rec{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--rule);border-radius:var(--r);margin-bottom:8px;background:var(--sheet-2)}
.att-rec .cell{margin:0;cursor:default}
.att-rec .cell:hover{background:transparent}

/* ---------- 外观设置 ---------- */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.theme-opt{border:1px solid var(--rule);border-radius:var(--r);padding:10px;cursor:pointer;background:var(--sheet);display:flex;flex-direction:column;gap:8px}

.theme-opt b{font-size:13px}.theme-opt span{font-size:11.5px;color:var(--ink-3)}


/* ---------- 页内子标签：下划线式，像书页眉的分节 ---------- */

  .bn-wrap{position:relative}

}
@media(max-width:600px){.card-grid{grid-template-columns:1fr}.kanban{grid-template-columns:1fr}.sum-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ============ 基础常量与工具（复用 v8） ============ */
const KEY="tutor-workspace-v1";
const TEACHER_COLORS=["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#14b8a6"];
const STATUS_TEXT={pending:"待上课",done:"已完成",cancelled:"已取消"};
const STAGES=["线索池","跟进中","试听","成交","流失"];
const LEAD_SOURCES=["抖音","小红书","微信朋友圈","转介绍","大众点评","地推","其他"];
const EXPENSE_CATS=["房租","广告投放","教材物料","交通","餐饮","平台佣金","其他"];
const uid=()=>Math.random().toString(36).slice(2,10);
const fmt=n=>(n<0?"−¥":"¥")+Math.abs(Math.round(n)).toLocaleString("zh-CN");
const fmtH=n=>`<span class="cur">${n<0?"−¥":"¥"}</span>${Math.abs(Math.round(n)).toLocaleString("zh-CN")}`;
const p2=n=>String(n).padStart(2,"0");
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ds=(y,m,d)=>`${y}-${p2(m)}-${p2(d)}`;
const dim=(y,m)=>new Date(y,m,0).getDate();
const dn=(y,m,d)=>["日","一","二","三","四","五","六"][new Date(y,m-1,d).getDay()];
const addDays=(date,n)=>{const d=new Date(date+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const todayStr=()=>new Date().toISOString().slice(0,10);
const statusLabel=s=>STATUS_TEXT[s]||"待上课";
const studentCourseIds=st=>st&&Array.isArray(st.courseIds)&&st.courseIds.length?st.courseIds:(st&&st.courseId?[st.courseId]:[]);
const primaryCourseId=sid=>{const st=typeof sid==="object"?sid:sm()[sid];return studentCourseIds(st)[0]||((S.courses[0]||{}).id||"");};
const courseNames=st=>{const C=cm();return studentCourseIds(st).map(id=>C[id]?C[id].name:"").filter(Boolean).join(" / ")||"-";};
const courseShort=st=>{const C=cm();return studentCourseIds(st).map(id=>((C[id]||{}).name||"").replace(/1对1辅导/g,"").slice(0,4)).filter(Boolean).join("/")||"-";};
const courseOptions=sel=>{const set=new Set((Array.isArray(sel)?sel:[sel]).filter(Boolean));return S.courses.map(c=>`<option value="${c.id}"${set.has(c.id)?" selected":""}>${esc(c.name)}</option>`).join("");};
const courseCheckList=(name,sel)=>{const set=new Set((Array.isArray(sel)?sel:[sel]).filter(Boolean));return`<div class="check-list" id="${name}">`+S.courses.map(c=>`<label class="check-item"><input type="checkbox" value="${c.id}"${set.has(c.id)?" checked":""}><span>${esc(c.name)}</span></label>`).join("")+`</div>`;};
const checkedValues=id=>[...document.querySelectorAll("#"+id+" input[type=checkbox]:checked")].map(c=>c.value);
const cm=()=>Object.fromEntries(S.courses.map(c=>[c.id,c]));
const sm=()=>Object.fromEntries(S.students.map(s=>[s.id,s]));
const tm=()=>Object.fromEntries((S.teachers||[]).map(t=>[t.id,t]));

/* ============ 默认数据（v8 业务数据 + 新模块） ============ */
const DD={courses:[{id:"c1",name:"数学1对1辅导",price:280},{id:"c2",name:"英语1对1辅导",price:260},{id:"c3",name:"语文1对1辅导",price:240},{id:"c4",name:"物理1对1辅导",price:300}],students:[{id:"s1",name:"张明",courseId:"c1",note:"赠送一节"},{id:"s2",name:"李华",courseId:"c2",note:"包含试听课"},{id:"s3",name:"王芳",courseId:"c3",note:"已结课"},{id:"s4",name:"刘洋",courseId:"c4",note:""},{id:"s5",name:"陈晨",courseId:"c1",note:""},{id:"s6",name:"赵雷",courseId:"c2",note:""}],payments:[{id:"p1",date:"2025-02-01",studentId:"s1",amount:5600,hours:20,note:""},{id:"p2",date:"2025-02-08",studentId:"s2",amount:7800,hours:30,note:"包含一节试听课"},{id:"p3",date:"2025-03-01",studentId:"s3",amount:2400,hours:10,note:""},{id:"p4",date:"2025-03-18",studentId:"s4",amount:7200,hours:24,note:""},{id:"p5",date:"2025-04-05",studentId:"s5",amount:4480,hours:16,note:""},{id:"p6",date:"2026-01-10",studentId:"s6",amount:3120,hours:12,note:""},{id:"p7",date:"2026-01-22",studentId:"s4",amount:3000,hours:10,note:"续费"}],attendance:{s1:{"2025-02-03":1,"2025-02-10":1,"2025-02-17":1,"2025-02-24":1,"2025-03-03":1,"2025-03-10":1,"2025-03-17":1,"2025-03-24":1,"2026-01-12":1,"2026-01-19":1,"2026-01-26":1,"2026-02-02":1},s2:{"2025-02-12":1,"2025-02-19":1,"2025-02-26":1,"2025-03-05":1,"2025-03-12":1,"2025-03-19":1,"2025-03-26":1,"2025-04-02":1,"2025-04-09":1,"2025-04-16":1,"2025-04-23":1,"2025-04-30":1,"2025-05-07":1,"2025-05-14":1,"2025-05-21":1,"2025-05-28":1,"2025-06-04":1,"2025-06-11":1,"2026-01-14":1,"2026-01-21":1,"2026-01-28":1,"2026-02-04":1,"2026-02-11":1,"2026-02-18":1,"2026-02-25":1,"2026-03-04":1,"2026-03-11":1},s3:{"2025-03-06":1,"2025-03-13":1,"2025-03-20":1,"2025-03-27":1,"2025-04-03":1,"2025-04-10":1,"2025-04-17":1,"2025-04-24":1,"2025-05-01":1,"2025-05-08":1},s4:{"2025-03-21":1,"2025-03-28":1,"2025-04-04":1,"2025-04-11":1,"2025-04-18":1,"2025-04-25":1,"2026-01-16":1,"2026-01-23":1,"2026-01-30":1},s5:{"2025-04-09":1,"2025-04-16":1,"2025-04-23":1,"2025-04-30":1,"2025-05-07":1,"2026-01-13":1,"2026-01-20":1},s6:{"2026-01-17":1,"2026-01-2 /* ============ 状态归一化 ============ */
function normalizeS(d){
  const n=JSON.parse(JSON.stringify(d||DD));
  if(!Array.isArray(n.courses))n.courses=[];
  n.courses=n.courses.map(c=>({...c,unitsPerSession:(typeof c.unitsPerSession==="number"&&c.unitsPerSession>0)?c.unitsPerSession:1}));
  const firstCourseId=(n.courses[0]||{}).id||"";
  if(!Array.isArray(n.students))n.students=[];
  n.students=n.students.map(st=>{
    const ids=Array.isArray(st.courseIds)&&st.courseIds.length?st.courseIds:(st.courseId?[st.courseId]:(firstCourseId?[firstCourseId]:[]));
    return{...st,courseIds:[...new Set(ids.filter(Boolean))],courseId:ids[0]||""};
  });
  if(!n.attendance||typeof n.attendance!=="object")n.attendance={};
  if(!Array.isArray(n.teachers))n.teachers=[{id:"t1",name:"王老师",color:"var(--qing)",note:""}];
  if(!Array.isArray(n.schedules))n.schedules=[];
  n.teachers=n.teachers.map((t,i)=>({id:t.id||uid(),name:t.name||`老师${i+1}`,color:t.color||TEACHER_COLORS[i%TEACHER_COLORS.length],note:t.note||""}));
  n.schedules=n.schedules.map(sc=>{
    const st=n.students.find(x=>x.id===sc.studentId);
    const cid=sc.courseId||(st&&st.courseIds&&st.courseIds[0])||firstCourseId;
    return{id:sc.id||uid(),teacherId:sc.teacherId||"",studentId:sc.studentId||"",courseId:cid||"",date:sc.date||"",time:sc.time||"",status:sc.status||"pending",note:sc.note||""};
  });
  const _pm=Object.fromEntries(n.courses.map(c=>[c.id,c.price]));
  Object.keys(n.attendance).forEach(sid=>{const recs=n.attendance[sid];if(!recs||typeof recs!=="object")return;const st=n.students.find(s=>s.id===sid);const defc=(st&&st.courseIds&&st.courseIds[0])||((n.courses[0]||{}).id||"");Object.keys(recs).forEach(date=>{const v=recs[date];const arr=Array.isArray(v)?v:[v];const fixed=arr.map(x=>{if(x&&typeof x==="object"&&!Array.isArray(x)){const cid=x.courseId||defc;return(typeof x.price==="number")?{...x,courseId:cid}:{...x,courseId:cid,price:_pm[cid]||0};}const cid=defc;return{time:x||1,courseId:cid,price:_pm[cid]||0};});recs[date]=fixed.length>1?fixed:fixed[0];});});
  if(!Array.isArray(n.todos))n.todos=[];
  if(!Array.isArray(n.expenses))n.expenses=[];
  if(!Array.isArray(n.otherIncomes))n.otherIncomes=[];
  if(!Array.isArray(n.leads))n.leads=[];
  if(!Array.isArray(n.materials))n.materials=[];
  if(!Array.isArray(n.referralRewarded))n.referralRewarded=[];
  if(!n.settings||typeof n.settings!=="object")n.settings={};
  n.settings=Object.assign({teacherName:"王老师",lowBalanceThreshold:4,remindAheadClasses:2,referralRewardType:"课时",referralRewardValue:2,theme:"ledger",density:"cozy"},n.settings);
  n.todos=n.todos.map(t=>({id:t.id||uid(),title:t.title||"",due:t.due||todayStr(),priority:t.priority||"P2",done:!!t.done,note:t.note||""}));
  n.expenses=n.expenses.map(e=>({id:e.id||uid(),date:e.date||todayStr(),category:e.category||"其他",amount:Number(e.amount)||0,note:e.note||""}));
  n.otherIncomes=n.otherIncomes.map(e=>({id:e.id||uid(),date:e.date||todayStr(),source:e.source||"其他",amount:Number(e.amount)||0,note:e.note||""}));
  n.leads=n.leads.map(l=>({id:l.id||uid(),name:l.name||"",phone:l.phone||"",source:l.source||"其他",domain:l.domain==="私域"?"私域":"公域",stage:STAGES.includes(l.stage)?l.stage:"线索池",intent:Number(l.intent)||0,note:l.note||"",referrer:l.referrer||"",studentId:l.studentId||"",createdAt:l.createdAt||todayStr(),lastFollow:l.lastFollow||l.createdAt||todayStr()}));
  n.materials=n.materials.map(m=>({id:m.id||uid(),title:m.title||"未命名",courseId:m.courseId||"",studentId:m.studentId||"",type:m.type||"其他",url:m.url||"",content:m.content||"",tags:m.tags||"",attachment:m.attachment||"",fileName:m.fileName||"",createdAt:m.createdAt||todayStr()}));
  return n;
}

function attendanceRecords(sid,dt){const v=(S.attendance[sid]||{})[dt];if(!v)return[];return(Array.isArray(v)?v:[v]).map(x=>normAttRecord(sid,x));}
function allAttendanceRecords(sid){return Object.keys(S.attendance[sid]||{}).flatMap(date=>attendanceRecords(sid,date).map(r=>({date,...r})));}
function ah(sid,dt){return attendanceRecords(sid,dt).length>0;}

function courseUnits(cid){const c=cm()[cid];return(c&&typeof c.unitsPerSession==="number"&&c.unitsPerSession>0)?c.unitsPerSession:1;}
function recordUnits(r){return(r&&typeof r.units==="number"&&r.units>0)?r.units:1;}
function recordCourseId(sid,r){return(r&&r.courseId)||primaryCourseId(sid);}
function recordFee(sid,r){const base=(r&&typeof r.price==="number")?r.price:coursePrice(recordCourseId(sid,r));return base*recordUnits(r);}

function ml(y,m,sid){return allAttendanceRecords(sid).filter(r=>{const[dy,dm]=r.date.split("-").map(Number);return dy===y&&dm===m;}).reduce((a,r)=>a+recordUnits(r),0);}
function mf(y,m,sid){return allAttendanceRecords(sid).filter(r=>{const[dy,dm]=r.date.split("-").map(Number);return dy===y&&dm===m;}).reduce((a,r)=>a+recordFee(sid,r),0);}

function removeAttendanceRecord(sid,date,idx){

function rHome(){
  const t=todayStr();

  } else {
    over.forEach(x=>todayHtml+=`<div class="mini"><div class="ic" style="background:var(--zhu-2);color:var(--zhu)">!</div><div class="mc"><div class="mt">${esc(x.title)}</div><div class="ms">逾期待办，截止 ${x.due}</div></div><button class="chip red" data-action="todo-done" data-id="${x.id}">完成</button></div>`);
    todayTodos.forEach(x=>todayHtml+=`<div class="mini"><div class="ic" style="background:var(--qing-2);color:var(--qing-3)"></div><div class="mc"><div class="mt">${esc(x.title)}</div><div class="ms">今日待办 ${x.priority}级</div></div><button class="chip blue" data-action="todo-done" data-id="${x.id}">完成</button></div>`);
    todaySched.forEach(sc=>{const st=sm()[sc.studentId],te=tm()[sc.teacherId],c=cm()[sc.courseId];todayHtml+=`<div class="mini"><div class="ic" style="background:var(--qing-2);color:var(--qing)">课</div><div class="mc"><div class="mt">${sc.time} ${esc(st?st.name:"")} ${esc(c?c.name:"")}</div><div class="ms">${esc(te?te.name:"")} ${statusLabel(sc.status)}</div></div><button class="chip blue" data-action="edit-schedule" data-sid="${sc.id}">详情</button></div>`;});
    low.forEach(x=>{const lvl=x.level==="danger"?"red":"amber";const bg=x.level==="danger"?"var(--zhu-2)":"var(--amber-2)";const fg=x.level==="danger"?"var(--zhu)":"var(--amber)";todayHtml+=`<div class="mini"><div class="ic" style="background:${bg};color:${fg}">余</div><div class="mc"><div class="mt">${esc(x.s.name)} 课时将尽</div><div class="ms">剩余 ${x.remaining} 课时${x.level==="danger"?" 需充值":""}</div></div><button class="chip ${lvl}" data-action="recharge" data-sid="${x.s.id}">提醒</button></div>`;});

/* ============ 视图：收支管理 ============ */
function svgMonthlyFinance(){
  const months=[];const now=new Date();
  for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({m:d.getMonth()+1,key:`${d.getFullYear()}-${p2(d.getMonth()+1)}`});}
  const data=months.map(mo=>{
    const inc=S.payments.filter(p=>p.date.startsWith(mo.key)).reduce((a,p)=>a+p.amount,0)+S.otherIncomes.filter(p=>p.date.startsWith(mo.key)).reduce((a,p)=>a+p.amount,0);
    const exp=S.expenses.filter(p=>p.date.startsWith(mo.key)).reduce((a,p)=>a+p.amount,0);
    return{label:mo.m+"月",inc,exp};
  });
  const mx=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const W=580,H=210,pl=42,pr=10,pt=10,pb=26;const cw=W-pl-pr,ch=H-pt-pb;const n=data.length;const groupW=cw/n;const bw=Math.min(13,groupW/3);
  if(!data.some(d=>d.inc||d.exp))return'<div class="empty-state">近 6 个月还没有收支记录</div>';
  let grid="",bars="",labels="";
  for(let g=0;g<=4;g++){const y=pt+ch-g/4*ch;const val=Math.round(mx*g/4);grid+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" class="c-grid"/><text x="${pl-6}" y="${y+4}" class="c-axis" text-anchor="end">${val>=1000?(val/1000)+"k":val}</text>`;}
  data.forEach((d,i)=>{const gx=pl+groupW*i+groupW/2;const ih=d.inc/mx*ch,eh=d.exp/mx*ch;const x1=gx-bw-2,x2=gx+2;
    bars+=`<rect x="${x1}" y="${pt+ch-ih}" width="${bw}" height="${ih}" rx="1" fill="var(--qing)"/>`;
    bars+=`<rect x="${x2}" y="${pt+ch-eh}" width="${bw}" height="${eh}" rx="1" fill="var(--zhu)"/>`;
    labels+=`<text x="${gx}" y="${H-9}" class="c-lab" text-anchor="middle">${d.label}</text>`;});
  grid+=`<line x1="${pl}" y1="${pt+ch}" x2="${W-pr}" y2="${pt+ch}" class="c-base"/>`;
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${grid}${bars}${labels}</svg><div style="display:flex;gap:18px;justify-content:center;margin-top:4px;font-size:12px;color:var(--ink-2)"><span><span class="legend-dot" style="background:var(--qing)"></span>收入</span><span><span class="legend-dot" style="background:var(--zhu);margin-left:12px"></span>支出</span></div>`;
}
function svgPieExpense(){
  const cat={};S.expenses.forEach(e=>cat[e.category]=(cat[e.category]||0)+e.amount);
  const entries=Object.entries(cat).filter(([k,v])=>v>0);const total=entries.reduce((a,[,v])=>a+v,0);
  if(total===0)return'<div class="empty-state">暂无支出记录</div>';
  const colors=["#1E5A6B","#A66A12","#C2412C","#5B7A5E","#7A6A8C","#8B909A","#B08968"];
  const cx=90,cy=90,r=62,sw=20,C=2*Math.PI*r;let off=0,segs="";
  entries.forEach(([k,v],i)=>{const len=v/total*C;const vis=entries.length>1?Math.max(0,len-2.5):len;segs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${sw}" stroke-dasharray="${vis.toFixed(2)} ${(C-vis).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;off+=len;});
  const legend=entries.map(([k,v],i)=>`<div class="legend-row"><span class="legend-dot" style="background:${colors[i%colors.length]}"></span><span style="flex:1">${esc(k)}</span><span class="num" style="color:var(--ink)">${fmt(v)}</span><span style="color:var(--ink-3);width:40px;text-align:right" class="num">${Math.round(v/total*100)}%</span></div>`).join("");
  return`<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><svg class="chart" width="180" height="180" viewBox="0 0 180 180">${segs}<text x="90" y="85" text-anchor="middle" class="c-axis">支出合计</text><text x="90" y="104" text-anchor="middle" style="font-size:15px;font-weight:600;fill:var(--ink)">${fmt(total)}</text></svg><div style="min-width:220px">${legend}</div></div>`;
}

/* ============ v2：报表中心 ============ */
function periodRange(kind){
  const t=todayStr();
  if(kind==="week")return[addDays(t,-6),t];
  if(kind==="month")return[t.slice(0,7)+"-01",t];
  return[addDays(t,-29),t];
}
function genBizReport(kind){
  const[a,b]=periodRange(kind);
  const incL=S.payments.filter(p=>p.date>=a&&p.date<=b).reduce((s,p)=>s+p.amount,0);
  const incO=S.otherIncomes.filter(p=>p.date>=a&&p.date<=b).reduce((s,p)=>s+p.amount,0);
  const exp=S.expenses.filter(p=>p.date>=a&&p.date<=b).reduce((s,p)=>s+p.amount,0);
  const lessons=S.students.reduce((s,st)=>s+allAttendanceRecords(st.id).filter(r=>r.date>=a&&r.date<=b).reduce((x,r)=>x+recordUnits(r),0),0);
  const newLeads=S.leads.filter(l=>l.createdAt>=a&&l.createdAt<=b).length;
  const won=S.leads.filter(l=>l.stage==="成交"&&l.lastFollow>=a&&l.lastFollow<=b).length;
  const totLeads=S.leads.length;
  const conv=totLeads?Math.round(S.leads.filter(l=>l.stage==="成交").length/totLeads*100):0;
  const low=lowBalanceStudents().filter(x=>x.level==="danger").length;
  const title=kind==="week"?"本周运营周报":kind==="month"?"本月运营月报":"近30天运营报告";
  return`【${S.settings.teacherName} ${title}】(${a} ~ ${b})
· 课时收入：${fmt(incL)}
· 其他收入：${fmt(incO)}
· 总支出：${fmt(exp)}
· 净收入：${fmt(incL+incO-exp)}
· 课时消耗：${lessons} 课时
· 新增线索：${newLeads} 条
· 成交：${won} 单（整体成交率 ${conv}%）
· 余额不足待提醒：${low} 名学员
—— 数据来自独立老师工作台`;
}
function genStudentReport(sid,kind){
  const d=shareStudentData(sid);if(!d)return"";
  const[a,b]=periodRange(kind);
  const att=allAttendanceRecords(sid).filter(r=>r.date>=a&&r.date<=b);
  const units=att.reduce((x,r)=>x+recordUnits(r),0);
  const first=att.length?att[0].date:"无";
  const last=att.length?att[att.length-1].date:"无";
  const C=cm(),T=tm();
  const up=d.up.map(sc=>`${sc.date} ${sc.time} ${esc((T[sc.teacherId]||{}).name||"")} ${esc((C[sc.courseId]||{}).name||"")}`).join("；")||"暂无";
  return`【${esc(d.st.name)} 学习进度报告】(${a} ~ ${b})
· 课程：${courseNames(d.st)}
· 累计购买 ${d.b} 课时，已上 ${d.l} 课时，剩余 ${d.r} 课时
· 本周期上课 ${units} 课时（${first} 至 ${last}）
· 近期排课：${up}
· 老师备注：${d.st.note||"无"}
—— ${esc(d.teacherName)}`;
}

/* ============ v2：转介绍裂变激励 ============ */
function referralStats(){
  const map={};
  S.leads.filter(l=>l.source==="转介绍").forEach(l=>{const key=l.referrer||"(未填推荐人)";if(!map[key])map[key]={referrer:key,total:0,won:0};map[key].total++;if(l.stage==="成交")map[key].won++;});
  const rewarded=new Set(S.referralRewarded||[]);
  const val=Number(S.settings.referralRewardValue)||0;
  return Object.values(map).map(x=>({...x,owed:x.won*val,rewarded:rewarded.has(x.referrer)})).sort((a,b)=>b.won-a.won);
}

      <div style="display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;padding:0 0 4px;font-size:11px;color:var(--ink-3);font-weight:600"><span>日期</span><span>金额(¥)</span><span>课时(节)</span><span></span></div>
      ${prows||'<div style="font-size:12px;color:var(--ink-3);text-align:center;padding:8px">暂无缴费记录</div>'}
      <div style="margin-top:6px"><button class="btn sm" style="width:100%;padding:8px" data-action="open-add-pay-for" data-sid="${m.sid}">+ 新增缴费记录</button></div>
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn sm ghost" data-action="share-student" data-sid="${m.sid}">生成分享页</button><button class="btn" data-action="confirm-edit-student" data-sid="${m.sid}">保存</button></div></div></div>`;
  }
  if(m.type==="add-pay"){
    const stuOpts=S.students.map(s=>`<option value="${s.id}"${m.preStudentId===s.id?" selected":""}>${s.name}</option>`).join("");
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">添加缴费记录</div>
      <label class="flabel">学员</label><select id="np-stu" class="fi">${stuOpts}</select>
      <label class="flabel">日期</label><input id="np-date" class="fi" type="date" value="${todayStr()}">
      <label class="flabel">金额 (¥)</label><input id="np-amt" class="fi" type="number" min="0" placeholder="0">
      <label class="flabel">课时 (节)</label><input id="np-hrs" class="fi" type="number" min="0" placeholder="0">
      <label class="flabel">备注</label><input id="np-note" class="fi" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-add-pay" data-return-sid="${m.returnSid||""}">保存</button></div></div></div>`;

  if(m.type==="add-course"){
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">添加课程</div>
      <label class="flabel">课程名称</label><input id="nc-name" class="fi" placeholder="如：英语口语1对1辅导">
      <label class="flabel">单价 (¥/课时)</label><input id="nc-price" class="fi" type="number" min="0" placeholder="0">
      <label class="flabel">每节课算几个课时</label><input id="nc-units" class="fi" type="number" min="0.5" step="0.5" value="1">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-add-course">保存</button></div></div></div>`;
  }
  if(m.type==="add-teacher"||m.type==="edit-teacher"){
    const t=m.tid?tm()[m.tid]:null;const color=t?t.color:TEACHER_COLORS[(S.teachers||[]).length%TEACHER_COLORS.length];
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">${t?"编辑老师":"添加老师"}</div>
      <label class="flabel">姓名</label><input id="nt-name" class="fi" value="${esc(t?t.name:"")}" placeholder="老师姓名">
      <label class="flabel">颜色</label><input id="nt-color" class="fi color-input" type="color" value="${color}">
      <label class="flabel">备注</label><input id="nt-note" class="fi" value="${esc(t?t.note:"")}" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-teacher" data-tid="${m.tid||""}">保存</button></div></div></div>`;
  }
  if(m.type==="add-schedule"||m.type==="edit-schedule"){
    const T=tm(),sc=m.sid?(S.schedules||[]).find(x=>x.id===m.sid):null;
    const teacherOpts=(S.teachers||[]).map(t=>`<option value="${t.id}"${sc&&sc.teacherId===t.id?" selected":""}>${esc(t.name)}</option>`).join("");
    const preSid=m.preStudentId||(sc?sc.studentId:"");
    const studentOpts=S.students.map(s=>`<option value="${s.id}"${s.id===preSid?" selected":""}>${esc(s.name)}</option>`).join("");
    const selectedStudent=preSid?sm()[preSid]:(sc?M[sc.studentId]:S.students[0]);const courseOpts=courseOptions(sc?sc.courseId:studentCourseIds(selectedStudent)[0]);
    const statusOpts=Object.keys(STATUS_TEXT).map(k=>`<option value="${k}"${(sc?sc.status:"pending")===k?" selected":""}>${STATUS_TEXT[k]}</option>`).join("");
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box wide"><div class="modal-title">${sc?"编辑排课":"新增排课"}</div>
      ${(S.teachers||[]).length?"":'<div class="empty-state" style="margin-bottom:10px">请先在老师管理中添加老师</div>'}
      <div class="two-col"><div><label class="flabel">老师</label><select id="sc-teacher" class="fi">${teacherOpts}</select></div><div><label class="flabel">学员</label><select id="sc-student" class="fi">${studentOpts}</select></div></div>
      <div class="two-col"><div><label class="flabel">日期</label><input id="sc-date" class="fi" type="date" value="${sc?sc.date:todayStr()}"></div><div><label class="flabel">开始时间</label><input id="sc-time" class="fi" type="time" value="${sc?sc.time:"18:00"}"></div></div>
      <label class="flabel">本次课程 / 班级</label><select id="sc-course" class="fi">${courseOpts}</select>
      ${sc?`<label class="flabel">状态</label><select id="sc-status" class="fi">${statusOpts}</select>`:`<div class="two-col"><div><label class="flabel">排课方式</label><select id="sc-repeat" class="fi"><option value="once">单次</option><option value="weekly">每周重复</option></select></div><div><label class="flabel">生成周数</label><input id="sc-weeks" class="fi" type="number" min="1" max="52" value="4"></div></div>`}
      <label class="flabel">备注</label><input id="sc-note" class="fi" value="${esc(sc?sc.note:"")}" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button>
        ${sc&&sc.status!=="done"?`<button class="btn sm" data-action="complete-schedule" data-sid="${sc.id}">标记完成</button>`:""}
        ${sc?`<button class="btn sm danger" data-action="cancel-schedule" data-sid="${sc.id}">取消课程</button><button class="btn sm danger" data-action="del-schedule" data-sid="${sc.id}">删除</button>`:""}
        <button class="btn" data-action="confirm-schedule" data-sid="${m.sid||""}">保存</button></div></div></div>`;
  }
  if(m.type==="data-file"&&APP){
    const i=m.info||{},snaps=m.snaps||[],rows=m.logRows||[];
    const kb=n=>n>=1048576?(n/1048576).toFixed(1)+" MB":Math.max(1,Math.round(n/1024))+" KB";
    const logHtml=rows.length?rows.slice(0,12).map(r=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:5px 0;border-bottom:1px solid var(--sheet-2)">
        <span class="badge ${r.action==="cancel"?"badge-danger":"badge-ok"}" style="flex-shrink:0">${r.action==="cancel"?"取消":"打卡"}</span>
        <span style="flex:1;min-width:0;color:var(--ink-2)">${esc(r.studentName||"?")} · ${esc(r.date)} · ${esc(r.courseName||"")} · ${r.units}课时</span>
        <span style="color:var(--ink-3);flex-shrink:0">${esc(String(r.at).slice(0,16).replace("T"," "))}</span></div>`).join("")
      :'<div style="font-size:12px;color:var(--ink-3);padding:8px 0">还没有打卡记录</div>';
    const snapHtml=snaps.length?snaps.slice(0,8).map(x=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px;padding:6px 0;border-bottom:1px solid var(--sheet-2)">
        <span style="flex:1;color:var(--ink-2)">${esc(String(x.at).slice(0,16).replace("T"," "))} · ${esc(x.reason)} · ${kb(x.size)}</span>
        <button class="btn sm ghost" data-action="db-restore" data-id="${x.id}">回滚到这里</button></div>`).join("")
      :'<div style="font-size:12px;color:var(--ink-3);padding:8px 0">暂无快照</div>';
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box wide"><div class="modal-title">数据库</div>
      <div class="tip-bar green" style="margin-bottom:12px">数据存在本机 SQLite 数据库里，每次改动自动写入。删浏览器、换浏览器、清缓存都不影响。</div>
      <div style="background:var(--sheet-2);border-radius:9px;padding:11px 13px;font-size:12.5px;line-height:1.9;margin-bottom:12px;word-break:break-all">
        <div>位置：<code style="font-size:11.5px">${esc(i.path||"读取中…")}</code></div>
        <div>大小：<b>${i.sizeBytes?kb(i.sizeBytes):"-"}</b> · 学员 <b>${i.students||0}</b> · 打卡 <b>${i.attendance||0}</b> 条 · 缴费 <b>${i.payments||0}</b> 条</div>
        <div>审计流水 <b>${i.logEntries||0}</b> 条 · 自动快照 <b>${i.snapshots||0}</b> 份</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn sm" data-action="db-backup">备份数据库…</button>
        <button class="btn sm ghost" data-action="db-export">导出 JSON…</button>
        <button class="btn sm ghost" data-action="db-import">从 JSON 导入…</button>
        <button class="btn sm ghost" data-action="db-snapshot">立即存快照</button>
        <button class="btn sm ghost" data-action="db-reveal">打开文件夹</button>
      </div>
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">考勤审计流水（打卡 / 取消都留痕）</div>
      <div style="max-height:170px;overflow-y:auto;margin-bottom:14px">${logHtml}</div>
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">自动快照（每小时一份 + 每次启动，保留最近 30 份）</div>
      <div style="max-height:150px;overflow-y:auto">${snapHtml}</div>
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close" style="width:100%">关闭</button></div></div></div>`;
  }
  if(m.type==="data-file"){
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">数据文件与备份</div>
      ${_fileHandle?`<div style="background:var(--qing-2);color:var(--qing);padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px">已绑定本地数据文件，修改会实时写入，清缓存不会丢。</div>`:`<div style="background:var(--amber-2);color:var(--amber);padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px">当前数据只存在浏览器里，清缓存会丢。建议绑定一个本地数据文件。</div>`}
      ${FSA_OK?`<button class="btn" style="width:100%;margin-bottom:8px" data-action="file-new">新建数据文件并绑定</button><button class="btn ghost" style="width:100%;padding:9px;margin-bottom:8px" data-action="file-open">打开已有数据文件并绑定</button>`:`<div style="font-size:12px;color:var(--ink-2);margin-bottom:8px">此浏览器不支持绑定本地文件（仅电脑版 Chrome / Edge 支持）。请用下面的手动备份，或换电脑浏览器。</div>`}
      <hr class="divider"><button class="btn ghost" style="width:100%;padding:9px" data-action="manual-backup">立即导出一份备份</button>
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">关闭</button></div></div></div>`;
  }
  /* 新增：待办 / 收支 / 招生 弹窗 */
  if(m.type==="add-todo"||m.type==="edit-todo"){
    const x=m.tid?S.todos.find(t=>t.id===m.tid):null;
    const due=x?x.due:todayStr();const prio=x?x.priority:"P1";
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">${x?"编辑待办":"新建待办"}</div>
      <label class="flabel">事项</label><input id="td-title" class="fi" value="${esc(x?x.title:"")}" placeholder="如：给小明家长发续费提醒">
      <div class="two-col"><div><label class="flabel">截止日期</label><input id="td-due" class="fi" type="date" value="${due}"></div><div><label class="flabel">优先级</label><select id="td-prio" class="fi">${["P0","P1","P2"].map(p=>`<option value="${p}"${p===prio?" selected":""}>${p}</option>`).join("")}</select></div></div>
      <label class="flabel">备注</label><input id="td-note" class="fi" value="${esc(x?x.note:"")}" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-todo" data-tid="${m.tid||""}">保存</button></div></div></div>`;
  }
  if(m.type==="add-expense"){
    const catOpts=EXPENSE_CATS.map(c=>`<option value="${c}">${c}</option>`).join("");
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">记一笔支出</div>
      <label class="flabel">日期</label><input id="ex-date" class="fi" type="date" value="${todayStr()}">
      <label class="flabel">分类</label><select id="ex-cat" class="fi">${catOpts}</select>
      <label class="flabel">金额 (¥)</label><input id="ex-amt" class="fi" type="number" min="0" placeholder="0">
      <label class="flabel">备注</label><input id="ex-note" class="fi" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-expense">保存</button></div></div></div>`;
  }
  if(m.type==="add-income"){
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">记一笔其他收入</div>
      <label class="flabel">日期</label><input id="in-date" class="fi" type="date" value="${todayStr()}">
      <label class="flabel">来源</label><input id="in-src" class="fi" placeholder="如：资料售卖 / 平台奖励">
      <label class="flabel">金额 (¥)</label><input id="in-amt" class="fi" type="number" min="0" placeholder="0">
      <label class="flabel">备注</label><input id="in-note" class="fi" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-income">保存</button></div></div></div>`;
  }
  if(m.type==="add-lead"||m.type==="edit-lead"){
    const l=m.lid?S.leads.find(x=>x.id===m.lid):null;
    const srcOpts=LEAD_SOURCES.map(s=>`<option value="${s}"${l&&l.source===s?" selected":""}>${s}</option>`).join("");
    const stageOpts=STAGES.map(s=>`<option value="${s}"${l&&l.stage===s?" selected":""}>${s}</option>`).join("");
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">${l?"编辑线索":"新增线索"}</div>
      <label class="flabel">家长/学员姓名</label><input id="ld-name" class="fi" value="${esc(l?l.name:"")}" placeholder="姓名">
      <label class="flabel">联系电话</label><input id="ld-phone" class="fi" placeholder="手机号">
      <div class="two-col"><div><label class="flabel">来源渠道</label><select id="ld-src" class="fi">${srcOpts}</select></div><div><label class="flabel">公域/私域</label><select id="ld-dom" class="fi">${["公域","私域"].map(d=>`<option value="${d}"${l&&l.domain===d?" selected":""}>${d}</option>`).join("")}</select></div></div>
      <label class="flabel">推荐人（来源选「转介绍」时填写，用于裂变激励统计）</label><input id="ld-ref" class="fi" value="${esc(l?l.referrer:"")}" placeholder="如：老学员张明家长">
      <div class="two-col"><div><label class="flabel">阶段</label><select id="ld-stage" class="fi">${stageOpts}</select></div><div><label class="flabel">意向金额(¥)</label><input id="ld-intent" class="fi" type="number" min="0" value="${l?l.intent:0}"></div></div>
      <label class="flabel">备注</label><input id="ld-note" class="fi" value="${esc(l?l.note:"")}" placeholder="备注（可选）">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-lead" data-lid="${m.lid||""}">保存</button></div></div></div>`;
  }
  if(m.type==="recharge-msg"){
    const st=sm()[m.sid];const txt=rechargeText(m.sid);
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">续费提醒话术</div>
      <div style="background:var(--sheet-2);border-radius:10px;padding:14px;font-size:14px;line-height:1.7;color:var(--ink)">${esc(txt)}</div>
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">关闭</button><button class="btn" data-action="copy-text" data-text="${esc(txt)}">复制话术</button></div></div></div>`;
  }
  if(m.type==="share-student"){
    const sid=m.sid;const body=rShareBody(sid);
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box wide"><div class="modal-title">学习档案分享页</div>
      ${body}
      <div style="font-size:12px;color:var(--ink-2);margin:12px 0 4px;line-height:1.6">这是一个<strong>只读</strong>页面，家长可查看孩子课时、排课与缴费摘要。下载后通过微信发给家长即可，对方用手机浏览器打开。</div>
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">关闭</button><button class="btn" data-action="download-share" data-sid="${sid}">下载分享页（发给家长）</button></div></div></div>`;
  }
  if(m.type==="add-material"||m.type==="edit-material"){
    const x=m.id?S.materials.find(k=>k.id===m.id):null;
    const typeOpts=MAT_TYPES.map(t=>`<option value="${t}"${x&&x.type===t?" selected":""}>${t}</option>`).join("");
    const courseOpts=`<option value="">通用</option>`+S.courses.map(c=>`<option value="${c.id}"${x&&x.courseId===c.id?" selected":""}>${esc(c.name)}</option>`).join("");
    const stuOpts=`<option value="">公共资料</option>`+S.students.map(s=>`<option value="${s.id}"${x&&x.studentId===s.id?" selected":""}>${esc(s.name)}</option>`).join("");
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box"><div class="modal-title">${x?"编辑资料":"添加教学资料"}</div>
      <label class="flabel">标题</label><input id="mt-title" class="fi" value="${esc(x?x.title:"")}" placeholder="如：初三物理力学讲义">
      <div class="two-col"><div><label class="flabel">类型</label><select id="mt-type" class="fi">${typeOpts}</select></div><div><label class="flabel">关联课程</label><select id="mt-course" class="fi">${courseOpts}</select></div></div>
      <label class="flabel">归属学员（选公共则为通用资料）</label><select id="mt-stu" class="fi">${stuOpts}</select>
      <label class="flabel">内容 / 笔记（文本）</label><textarea id="mt-content" class="fi" rows="4" placeholder="可粘贴讲义、错题、要点">${esc(x?x.content:"")}</textarea>
      <label class="flabel">链接（如网盘 / 文档 URL，可选）</label><input id="mt-url" class="fi" value="${esc(x?x.url:"")}" placeholder="https://...">
      <label class="flabel">附件（可选，图片/文件会存入本机，建议 &lt; 2MB）</label><input id="mt-file" type="file" class="fi">
      <label class="flabel">标签（逗号分隔）</label><input id="mt-tags" class="fi" value="${esc(x?x.tags:"")}" placeholder="如：期中,复习">
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">取消</button><button class="btn" data-action="confirm-material" data-id="${m.id||""}">保存</button></div></div></div>`;
  }
  if(m.type==="report-student"){
    const sOpts=S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
    return`<div class="modal-overlay" data-action="modal-close"><div class="modal-box wide"><div class="modal-title">学员进度报告</div>
      <div class="two-col"><div><label class="flabel">选择学员</label><select id="rs-stu" class="fi">${sOpts}</select></div><div><label class="flabel">统计周期</label><select id="rs-kind" class="fi"><option value="week">本周</option><option value="month">本月</option><option value="30">近30天</option></select></div></div>
      <textarea id="rs-out" readonly class="fi" rows="9" style="margin-top:10px;background:var(--sheet-2);white-space:pre-wrap;font-size:13px;line-height:1.7"></textarea>
      <div class="modal-actions"><button class="btn ghost" data-action="modal-close">关闭</button><button class="btn" data-action="gen-student-report">生成</button><button class="btn sm ghost" data-action="copy-student-report">复制</button><button class="btn sm ghost" data-action="download-student-report">下载</button></div></div></div>`;
  }
  return"";
}

const SHORT={home:"首页",hours:"课时",students:"学员",calendar:"排课",todo:"待办",finance:"收支",recruit:"招生",report:"报表",library:"资料",settings:"设置"};
const VIEWS=[{id:"home",name:"工作台",icon:"home"},{id:"hours",name:"课时统计",icon:"chart"},{id:"students",name:"学员管理",icon:"users"},{id:"calendar",name:"日历排课",icon:"cal"},{id:"todo",name:"今日待办",icon:"check"},{id:"finance",name:"收支管理",icon:"wallet"},{id:"recruit",name:"招生面板",icon:"funnel"},{id:"report",name:"报表中心",icon:"report",bottom:false},{id:"library",name:"资料库",icon:"library",bottom:false},{id:"settings",name:"设置",icon:"gear"}];
function badgeFor(v){if(v==="todo"){const n=S.todos.filter(x=>!x.done).length;return n?n:"";}if(v==="students"){const n=lowBalanceStudents().filter(x=>x.level==="danger").length;return n?n:"";}return"";}
const MORE=["recruit","report","library"];
function rSidebar(){
  const tab=v=>`<button class="nav-item ${UI.view===v.id?"active":""}" data-action="nav" data-view="${v.id}" title="${v.name}"><span class="nav-label">${[...(SHORT[v.id]||v.name)].map(ch=>`<i>${ch}</i>`).join("")}</span>${badgeFor(v.id)?`<span class="nav-badge">${badgeFor(v.id)}</span>`:""}</button>`;
  const main=VIEWS.filter(v=>!MORE.includes(v.id)&&v.id!=="settings").map(tab).join("");
  const moreViews=VIEWS.filter(v=>MORE.includes(v.id));
  const fly=UI.moreOpen?`<div class="nav-flyout">${moreViews.map(v=>`<button class="${UI.view===v.id?"on":""}" data-action="nav" data-view="${v.id}">${ICON[v.icon]}<span>${v.name}</span>${badgeFor(v.id)?`<span class="nav-badge static">${badgeFor(v.id)}</span>`:""}</button>`).join("")}</div>`:"";
  const more=`<div class="nav-more-wrap"><button class="nav-item ${(MORE.includes(UI.view)||UI.moreOpen)?"active":""}" data-action="nav-more" title="招生 · 报表 · 资料" aria-expanded="${!!UI.moreOpen}"><span class="nav-label"><i>更</i><i>多</i></span></button>${fly}</div>`;
  const settings=tab(VIEWS.find(v=>v.id==="settings"));
  return`<aside class="sidebar"><div class="brand"><div class="brand-logo" title="独立老师工作台">师</div></div><nav class="nav">${main}${more}${settings}</nav><div class="side-foot">${[...(APP?"本机数据库":"存于浏览器")].map(ch=>`<i>${ch}</i>`).join("")}</div></aside>`;
}
function rBottomNav(){
  const items=VIEWS.map(v=>`<button class="bn-item ${UI.view===v.id?"active":""}" data-action="nav" data-view="${v.id}"><span class="bn-wrap">${ICON[v.icon]}${badgeFor(v.id)?`<span class="bn-badge">${badgeFor(v.id)}</span>`:""}</span><span>${v.name}</span></button>`).join("");
  return`<nav class="bottom-nav">${items}</nav>`;
}
function rTopbar(){
  const v=VIEWS.find(x=>x.id===UI.view);const title=v?v.name:"";
  let extra="";
  if(UI.view==="finance")extra=`<button class="btn sm ghost" data-action="export-finance-csv">导出收支 CSV</button>`;
  if(UI.view==="recruit")extra=`<button class="btn sm ghost" data-action="export-lead-csv">导出线索 CSV</button>`;
  if(UI.view==="hours")extra=`<button class="btn sm ghost" data-action="export-csv-hours">导出课时 CSV</button>`;
  const dbIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>';
  return`<header class="topbar"><h1>${title}</h1><span class="sub">${esc(S.settings.teacherName)}</span>
    <div class="topbar-actions">${extra}<button class="btn sm ghost" data-action="open-datafile">${dbIcon}${APP?"数据库":"数据"}</button></div></header>`;
}
function rView(){
  switch(UI.view){
    case "home":return rHome();
    case "hours":return rHours();
    case "students":return rStudents();
    case "calendar":return rCalendar();
    case "todo":return rTodo();
    case "finance":return rFinance();
    case "recruit":return rRecruit();
    case "report":return rReport();
    case "library":return rLibrary();
    case "settings":return rSettings();
    default:return rHome();
  }
}
function re(){
  applyAppearance();
  const sh=location.hash.match(/^#share=(.+)$/);
  if(sh){const sid=decodeURIComponent(sh[1]);const d=shareStudentData(sid);const body=d?rShareBody(sid):'<div class="empty-state">未找到该学员</div>';document.getElementById("app").innerHTML=`<div style="min-height:100vh;background:var(--sheet-2);padding:16px"><div style="max-width:620px;margin:0 auto">${body}<div style="text-align:center;margin-top:18px"><button class="btn ghost" data-action="exit-share">返回工作台</button></div></div></div>`;return;}
  const tip=APP
    ?(_saveErr?`<div class="tip-bar red">保存到数据库失败：${esc(_saveErr)}。请点右上角「数据库」查看，或先导出一份 JSON 保底</div>`:"")
    :(_pendingHandle?'<div class="tip-bar" style="cursor:pointer" data-action="reconnect-file">检测到已绑定的数据文件，点这里重新连接以继续自动保存</div>'
    :(_fileHandle?'':'<div class="tip-bar">数据存在浏览器本地，清缓存会丢。建议点右上角「数据」绑定本地文件或定期导出备份</div>'));
  document.getElementById("app").innerHTML=`
    <div class="layout">
      ${rSidebar()}
      <main class="main">${rTopbar()}<div class="content">${tip}${rView()}</div></main>
    </div>
    ${rBottomNav()}
    ${rModal()}`;
}

/* ============ 事件处理 ============ */
document.addEventListener("click",e=>{
  if(UI.moreOpen&&!e.target.closest(".nav-more-wrap")&&!e.target.closest(".modal-box")){UI.moreOpen=false;re();}
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action;
  if(a==="set-theme"){S.settings.theme=el.dataset.theme;saveS();re();return;}
  if(a==="nav-more"){su({moreOpen:!UI.moreOpen});return;}
  if(a==="nav"){su({view:el.dataset.view,moreOpen:false});return;}
  if(a==="modal-close"){if(e.target===el)su({modal:null});return;}
  if(a==="open-datafile"){
    su({modal:{type:"data-file"}});
    if(APP)refreshDbPanel();
    return;
  }
  if(a==="db-backup"){window.TWDB.backup().then(refreshDbPanel);return;}
  if(a==="db-export"){flushSave().then(()=>window.TWDB.exportJSON(JSON.parse(JSON.stringify(S))));return;}
  if(a==="db-import"){window.TWDB.importJSON();return;}
  if(a==="db-reveal"){window.TWDB.revealDataFolder();return;}
  if(a==="db-snapshot"){flushSave().then(()=>window.TWDB.snapshotNow(JSON.parse(JSON.stringify(S)))).then(refreshDbPanel);return;}
  if(a==="db-restore"){const id=+el.dataset.id;window.TWDB.restoreSnapshot(id).then(r=>{
    if(r&&r.ok&&r.state){S=normalizeS(r.state);re();su({modal:null});alert("已回滚到该快照");}
    else if(r&&r.error)alert("回滚失败："+r.error);
  });return;}
  if(a==="file-new"){bindNewFile();return;}
  if(a==="file-open"){bindOpenFile();return;}
  if(a==="manual-backup"){exportData();return;}
  if(a==="reconnect-file"){reconnectHandle();return;}
  if(a==="export"){exportCSV();return;}
  if(a==="export-csv-hours"){exportCSV();return;}
  if(a==="export-finance-csv"){exportFinanceCSV();return;}

  if(a==="reseed"){if(confirm("将用示例数据覆盖当前全部数据，确定？")){_fileHandle=null;ss(seedState());alert("已恢复示例数据");}return;}

  if(a==="add-teacher"){su({modal:{type:"add-teacher"}});return;}
  if(a==="edit-teacher"){su({modal:{type:"edit-teacher",tid:el.dataset.tid}});return;}
  if(a==="del-teacher"){delTeacher(el.dataset.tid);return;}
  if(a==="confirm-teacher"){const name=document.getElementById("nt-name").value.trim();const color=document.getElementById("nt-color").value;const note=document.getElementById("nt-note").value.trim();if(!name){alert("请输入老师姓名");return;}if(el.dataset.tid)updTeacher(el.dataset.tid,{name,color,note});else addTeacher({name,color,note});su({modal:null});return;}

  if(a==="download-share"){const sid=el.dataset.sid;const html=buildShareHTML(sid);if(!html){alert("未找到该学员");return;}const blob=new Blob([html],{type:"text/html;charset=utf-8;"});const aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);aEl.download=`${sm()[sid].name}学习档案_${todayStr()}.html`;aEl.click();return;}
  if(a==="exit-share"){location.hash="";re();return;}
  if(a==="gen-report"){const kind=el.dataset.kind;const txt=genBizReport(kind);const out=document.getElementById("report-out");if(out){out.textContent=txt;out.style.display="block";}return;}
  if(a==="copy-report"){const out=document.getElementById("report-out");const t=out?out.textContent:"";if(!t){alert("请先生成报告");return;}if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("已复制"));else alert(t);return;}
  if(a==="download-report"){const out=document.getElementById("report-out");const t=out?out.textContent:"";if(!t){alert("请先生成报告");return;}const blob=new Blob([t],{type:"text/plain;charset=utf-8;"});const aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);aEl.download=`运营报告_${todayStr()}.txt`;aEl.click();return;}
  if(a==="open-report-student"){su({modal:{type:"report-student"}});return;}
  if(a==="gen-student-report"){const sid=document.getElementById("rs-stu").value;const kind=document.getElementById("rs-kind").value;const out=document.getElementById("rs-out");if(out)out.value=genStudentReport(sid,kind);return;}
  if(a==="copy-student-report"){const out=document.getElementById("rs-out");const t=out?out.value:"";if(!t){alert("请先生成报告");return;}if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("已复制"));else alert(t);return;}
  if(a==="download-student-report"){const out=document.getElementById("rs-out");const t=out?out.value:"";if(!t){alert("请先生成报告");return;}const blob=new Blob([t],{type:"text/plain;charset=utf-8;"});const aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);aEl.download=`学员进度报告_${todayStr()}.txt`;aEl.click();return;}
  if(a==="add-material"){su({modal:{type:"add-material"}});return;}
  if(a==="edit-material"){su({modal:{type:"edit-material",id:el.dataset.id}});return;}
  if(a==="confirm-material"){const id=el.dataset.id;const title=document.getElementById("mt-title").value.trim();const type=document.getElementById("mt-type").value;const courseId=document.getElementById("mt-course").value;const studentId=document.getElementById("mt-stu").value;const content=document.getElementById("mt-content").value;const url=document.getElementById("mt-url").value.trim();const tags=document.getElementById("mt-tags").value.trim();const fileEl=document.getElementById("mt-file");if(!title){alert("请输入标题");return;}const doSave=(attachment,fileName)=>{const data={title,type,courseId,studentId,content,url,tags,attachment,fileName};if(id)updMaterial(id,data);else addMaterial(data);su({modal:null});};if(fileEl&&fileEl.files&&fileEl.files[0]){const f=fileEl.files[0];if(f.size>2*1024*1024){alert("附件超过 2MB，建议上传到网盘后用链接分享");return;}const rd=new FileReader();rd.onload=()=>doSave(rd.result,f.name);rd.readAsDataURL(f);}else{const ex=id?S.materials.find(k=>k.id===id):null;doSave(ex?ex.attachment:"",ex?ex.fileName:"");}return;}
  if(a==="del-material"){delMaterial(el.dataset.id);return;}
  if(a==="lead-trial"){const st=ensureLeadStudent(el.dataset.id);if(!st)return;su({modal:{type:"add-schedule",preStudentId:st.id}});return;}
  if(a==="lead-convert"){const st=ensureLeadStudent(el.dataset.id);if(!st)return;ss({...S,leads:S.leads.map(l=>l.id===el.dataset.id?{...l,stage:"成交",lastFollow:todayStr()}:l)});su({modal:{type:"add-pay",preStudentId:st.id,returnView:"recruit"}});return;}
  if(a==="toggle-referral"){const ref=el.dataset.ref;const set=new Set(S.referralRewarded||[]);if(set.has(ref))set.delete(ref);else set.add(ref);ss({...S,referralRewarded:[...set]});return;}
  /* 余额提醒 */
  if(a==="recharge"){su({modal:{type:"recharge-msg",sid:el.dataset.sid}});return;}
});
document.addEventListener("change",e=>{
  const el=e.target.closest("[data-action]");if(el){const a=el.dataset.action;
    if(a==="filter-teacher"){su({schTeacher:el.value});return;}
    if(a==="filter-student"){su({schStudent:el.value});return;}
    if(a==="set-density"){S.settings.density=el.checked?"compact":"cozy";saveS();re();return;}
    if(a==="set-threshold"){S.settings.lowBalanceThreshold=Math.max(0,parseInt(el.value)||0);saveS();return;}
    if(a==="set-ahead"){S.settings.remindAheadClasses=Math.max(0,parseInt(el.value)||0);saveS();return;}
    if(a==="set-teachername"){S.settings.teacherName=el.value.trim()||"老师";saveS();return;}
    if(a==="lib-type"){su({libType:el.value});return;}
    if(a==="lib-stu"){su({libStu:el.value});return;}
    if(a==="set-referral-type"){S.settings.referralRewardType=el.value;saveS();return;}
    if(a==="set-referral-value"){S.settings.referralRewardValue=Math.max(0,parseFloat(el.value)||0);saveS();return;}
  }
  if(e.target&&e.target.id==="data-import-input"){importData(e.target.files[0]);e.target.value="";}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&UI.moreOpen&&!UI.modal){su({moreOpen:false});return;}
  if(!UI.modal)return;
  if(e.key==="Escape"){su({modal:null});return;}
  if(e.key==="Enter"&&UI.modal.type==="time-pick"){const t=document.getElementById("time-input");const val=t?t.value:"";const cid=document.getElementById("time-course").value;const uEl=document.getElementById("time-units");const u=uEl?parseFloat(uEl.value):NaN;setAttendance(UI.modal.sid,UI.modal.date,val||1,cid,(!isNaN(u)&&u>0)?u:undefined);su({modal:null});}
});
/* 拉一次数据库信息填进「数据」弹窗 */
function refreshDbPanel(){
  if(!APP)return Promise.resolve();
  return Promise.all([window.TWDB.info(),window.TWDB.snapshots(),window.TWDB.log(30)]).then(([info,snaps,log])=>{
    if(UI.modal&&UI.modal.type==="data-file")
      su({modal:{...UI.modal,info:info&&info.ok?info:{},snaps:(snaps&&snaps.rows)||[],logRows:(log&&log.rows)||[]}});
  }).catch(e=>console.error(e));
}
if(APP){
  /* 主进程导入 / 回滚之后，把新数据推回页面 */
  window.TWDB.onReload(state=>{if(state){S=normalizeS(state);re();}});
  /* 关窗前把还没落盘的改动刷掉（debounce 窗口里最多 120ms） */
  window.addEventListener("beforeunload",()=>{if(_savePending)flushSave();});
  document.title="独立老师工作台";
}
re();
if(!APP)tryRestoreHandle();
</script>
